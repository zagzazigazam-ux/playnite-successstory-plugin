name: Build SuccessStory (.pext)

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Restore dependencies
      run: |
        git submodule update --init --recursive
        $csproj = Get-ChildItem -Recurse -Filter "SuccessStory.csproj" | Select-Object -First 1
        dotnet restore $csproj.FullName

    - name: Find and Build
      run: |
        $csproj = Get-ChildItem -Recurse -Filter "SuccessStory.csproj" | Select-Object -First 1
        if (-not $csproj) {
            Write-Error "Nu s-a gasit SuccessStory.csproj!"
            exit 1
        }
        Write-Host "S-a gasit proiectul la: $($csproj.FullName)"
        dotnet build $csproj.FullName -c Release
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SuccessStory_3_7_1_1.pext
        path: "**/bin/Release/*.pext"
