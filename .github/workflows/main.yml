name: Build SuccessStory (.pext)

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup .NET 6.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Initialize Submodules
      run: |
        git submodule sync --recursive
        git submodule update --init --recursive --force

    - name: Restore Solution
      run: |
        $sln = Get-ChildItem -Recurse -Filter "*.sln" | Select-Object -First 1
        if ($sln) {
            Write-Host "Se restaurează soluția: $($sln.FullName)"
            dotnet restore $sln.FullName --force
        } else {
            $csproj = Get-ChildItem -Recurse -Filter "SuccessStory.csproj" | Select-Object -First 1
            dotnet restore $csproj.FullName --force
        }

    - name: Build Solution / Project
      run: |
        $sln = Get-ChildItem -Recurse -Filter "*.sln" | Select-Object -First 1
        if ($sln) {
            Write-Host "Se compilează soluția: $($sln.FullName)"
            dotnet build $sln.FullName -c Release
        } else {
            $csproj = Get-ChildItem -Recurse -Filter "SuccessStory.csproj" | Select-Object -First 1
            dotnet build $csproj.FullName -c Release
        }
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SuccessStory_3_7_1_1.pext
        path: "**/bin/Release/*.pext"
