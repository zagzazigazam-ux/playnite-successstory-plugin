name: Build SuccessStory (.pext)

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: microsoft/setup-msbuild@v2

    - uses: nuget/setup-nuget@v2

    - name: Restore (packages.config)
      run: |
        if (Test-Path source/SuccessStory.sln) {
          nuget restore source/SuccessStory.sln
        } else {
          nuget restore source/SuccessStory.csproj -SolutionDirectory source
        }

    - name: Build
      run: |
        $target = if (Test-Path source/SuccessStory.sln) { "source/SuccessStory.sln" } else { "source/SuccessStory.csproj" }
        msbuild $target /p:Configuration=Release /m

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SuccessStory-build
        path: "**/bin/Release/**"
        if-no-files-found: warn
