name: Build SuccessStory (.pext)

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup .NET 6.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Initialize Submodules
      run: |
        git submodule sync --recursive
        git submodule update --init --recursive --force

    - name: Restore NuGet Packages
      run: |
        dotnet restore source/SuccessStory/SuccessStory.csproj --force

    - name: Build Project
      run: |
        dotnet build source/SuccessStory/SuccessStory.csproj -c Release --no-restore
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SuccessStory_3_7_1_1.pext
        path: "**/bin/Release/*.pext"
